name: 35-document-intake-pipeline

on:
  push:
    paths:
      - 'Portfolio-Automation/35-document-intake-pipeline/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/35-document-intake-pipeline.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/35-document-intake-pipeline/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/35-document-intake-pipeline.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate (Lint, Types, Corpus, Partial Failures & Pagination)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Portfolio-Automation/35-document-intake-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install project dependencies
        run: |
          uv sync --frozen

      - name: Code quality and lint checks (Ruff)
        run: |
          uv run ruff check .

      - name: Static type validation (Mypy)
        run: |
          uv run mypy .

      - name: Generate the deterministic corpus and check its manifest
        run: |
          uv run python corpus/generate.py --seed 42 --count 600
          uv run pytest tests/test_corpus.py -v

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait
          uv run python scripts/setup.py

      - name: Run P1 partial-failure and pagination suites
        run: |
          uv run pytest -m p1 -v -rxXs

      - name: Save container logs
        if: always()
        run: |
          mkdir -p results
          docker compose logs --no-color > results/compose-logs.txt 2>&1 || true

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pr-gate-results
          path: |
            Portfolio-Automation/35-document-intake-pipeline/results/
          if-no-files-found: ignore

  nightly-suite:
    name: Nightly ${{ matrix.suite.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # One runner per suite: each gets a clean stack and they run in parallel.
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: 'burst ingestion (500 documents)', args: 'tests/resilience/test_burst.py' }
          - { name: 'fault injection', args: 'tests/resilience/test_faults.py' }
          - { name: 'listing and search latency', args: 'tests/api/test_pagination.py -m perf' }
          - { name: 'classifier evaluation (3 seeds)', args: 'tests/eval/test_classifier.py -m eval' }
          - { name: '2.14.6 to 2.14.7 migration', args: 'tests/migration/test_upgrade.py -m migration' }
          - { name: 'Edge UI flow and accessibility scan', args: 'tests/ui/test_document_flow.py' }
    defaults:
      run:
        working-directory: Portfolio-Automation/35-document-intake-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install project dependencies and corpus
        run: |
          uv sync --frozen
          uv run python corpus/generate.py --seed 42 --count 600

      - name: Install Edge
        if: contains(matrix.suite.args, 'tests/ui/')
        run: |
          uv run playwright install --with-deps msedge

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait
          uv run python scripts/setup.py

      - name: Run ${{ matrix.suite.name }}
        run: |
          uv run pytest ${{ matrix.suite.args }} -v -rxXs

      - name: Save container logs
        if: always()
        run: |
          mkdir -p results
          docker compose logs --no-color > results/compose-logs.txt 2>&1 || true

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload nightly results and metrics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nightly-results-${{ strategy.job-index }}
          path: |
            Portfolio-Automation/35-document-intake-pipeline/results/
          if-no-files-found: ignore
