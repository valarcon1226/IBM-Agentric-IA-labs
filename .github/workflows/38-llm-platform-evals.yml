name: 38-llm-platform-evals

on:
  push:
    paths:
      - 'Portfolio-Automation/38-llm-platform-evals/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/38-llm-platform-evals.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/38-llm-platform-evals/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/38-llm-platform-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate (Lint, Mypy, qa_common & Fake Upstream Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Portfolio-Automation/38-llm-platform-evals
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Code quality checks (Ruff)
        run: |
          uv run ruff check .

      - name: Static type validation (Mypy)
        run: |
          uv run mypy tests scripts evals

      - name: Run qa_common unit tests
        run: |
          uv run --directory ../qa_common pytest -v

      - name: Run fake upstream unit tests
        run: |
          uv run pytest tests/test_fake_upstream.py -v

      - name: Run golden set validation unit tests
        run: |
          uv run pytest tests/evals/test_evals_validation.py -v
