name: 34-commerce-order-integrity

on:
  push:
    paths:
      - 'Portfolio-Automation/34-commerce-order-integrity/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/34-commerce-order-integrity.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/34-commerce-order-integrity/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/34-commerce-order-integrity.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full_nightly:
        description: 'Run full nightly suite (resilience, migration, perf)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate (Lint, Types, Unit Tests, P1 & Edge UI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Portfolio-Automation/34-commerce-order-integrity
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1edb5128c869962a74c7e6c0b4cb10e7c5b62b08 # v5.1.0
        with:
          version: 'latest'

      - name: Install project dependencies
        run: |
          uv sync --frozen

      - name: Code quality and lint checks (Ruff)
        run: |
          uv run ruff check .

      - name: Static type validation (Mypy)
        run: |
          uv run mypy tests scripts

      - name: Run qa_common unit tests
        run: |
          uv run --directory ../qa_common pytest -v

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait

      - name: Seed SUT database
        run: |
          uv run python scripts/seed.py

      - name: Run GraphQL client unit tests
        run: |
          uv run pytest tests/test_client.py -v

      - name: Run P1 suite (excluding resilience, migration, and perf)
        run: |
          uv run pytest -m "p1 and not (resilience or migration or perf)" -v

      - name: Install Microsoft Edge browser binary
        run: |
          uv run playwright install --with-deps msedge

      - name: Run Dashboard UI tests in Microsoft Edge
        run: |
          uv run pytest tests/ui/test_dashboard_orders.py --browser chromium --browser-channel msedge -v

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload results and traceability artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pr-gate-results
          path: |
            Portfolio-Automation/34-commerce-order-integrity/results/
            Portfolio-Automation/34-commerce-order-integrity/docs/TRACEABILITY.md
          retention-days: 14

  nightly-suite:
    name: Nightly Suite (Resilience, Migration & Load Perf)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_nightly == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Portfolio-Automation/34-commerce-order-integrity
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@1edb5128c869962a74c7e6c0b4cb10e7c5b62b08 # v5.1.0
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait

      - name: Seed SUT database
        run: |
          uv run python scripts/seed.py

      - name: Run Resilience test suite
        run: |
          uv run pytest -m "resilience" -v

      - name: Run Schema Migration upgrade test
        run: |
          uv run pytest -m "migration" -v -s

      - name: Run Headless Locust load test
        run: |
          uv run locust -f tests/perf/locustfile.py --headless -u 10 -r 2 --run-time 5m --host http://127.0.0.1:8000

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload nightly metrics and traces
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nightly-metrics
          path: |
            Portfolio-Automation/34-commerce-order-integrity/results/
            Portfolio-Automation/34-commerce-order-integrity/docs/TRACEABILITY.md
          retention-days: 30
