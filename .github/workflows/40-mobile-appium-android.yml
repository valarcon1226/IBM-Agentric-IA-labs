name: 40-mobile-appium-android

on:
  push:
    paths:
      - 'Portfolio-Automation/40-mobile-appium-android/**'
      - '.github/workflows/40-mobile-appium-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui-gate:
    name: Mobile Appium Tests (Android API 34 Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Install Python dependencies
        working-directory: Portfolio-Automation/40-mobile-appium-android
        run: |
          uv venv .venv
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint and code quality checks (Ruff)
        working-directory: Portfolio-Automation/40-mobile-appium-android
        run: |
          .venv/bin/ruff check .

      - name: Install Appium 3 and UiAutomator2 driver
        run: |
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3

      - name: Download and verify Android APK
        working-directory: Portfolio-Automation/40-mobile-appium-android
        run: |
          .venv/bin/python scripts/get_apk.py

      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash Portfolio-Automation/40-mobile-appium-android/scripts/run_ci.sh

      - name: Upload test artifacts and reports
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: mobile-test-artifacts
          if-no-files-found: warn
          path: |
            Portfolio-Automation/40-mobile-appium-android/artifacts/**
            Portfolio-Automation/40-mobile-appium-android/results/**
