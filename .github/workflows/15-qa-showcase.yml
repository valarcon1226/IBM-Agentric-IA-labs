name: 15-qa-showcase

on:
  push:
    paths:
      - 'Portfolio-Automation/15-qa-showcase/**'
      - '.github/workflows/15-qa-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: API and UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Portfolio-Automation/15-qa-showcase
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'Portfolio-Automation/15-qa-showcase/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Microsoft Edge for Playwright
        run: playwright install --with-deps msedge

      - name: Run tests
        run: pytest

      - name: Upload test summary and report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: qa-showcase-reports
          path: Portfolio-Automation/15-qa-showcase/reports/
          retention-days: 14
