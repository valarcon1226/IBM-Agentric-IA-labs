name: 37-identity-access

on:
  push:
    paths:
      - 'Portfolio-Automation/37-identity-access/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/37-identity-access.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/37-identity-access/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/37-identity-access.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full_nightly:
        description: 'Run full nightly suite (load, backpressure, pagination, import, migration)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate (Lint, Types, OIDC & P1 UI/API Suites)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Portfolio-Automation/37-identity-access
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install project dependencies
        run: |
          uv sync --frozen

      - name: Code quality and lint checks (Ruff)
        run: |
          uv run ruff check .

      - name: Static type validation (Mypy)
        run: |
          uv run mypy tests scripts

      - name: Run qa_common unit tests
        run: |
          uv run --directory ../qa_common pytest -v

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait

      - name: Seed SUT database with 10,000 baseline users
        run: |
          uv run python scripts/seed_users.py

      - name: Install Playwright browser dependencies (Edge, Firefox, WebKit)
        run: |
          uv run playwright install --with-deps msedge firefox webkit

      - name: Run OIDC flow and cryptographic token validation
        run: |
          uv run pytest tests/oidc.py -v

      - name: Run P1 Core API and UI suites (Token Replay, MFA Lockout, Password Reset)
        run: |
          uv run pytest tests/api/test_replay.py tests/ui/test_mfa_lockout.py tests/ui/test_password_reset.py -v

      - name: Save container logs
        if: always()
        run: |
          mkdir -p results
          docker compose logs --no-color > results/compose-logs.txt 2>&1 || true

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload results and traceability artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pr-gate-results
          path: |
            Portfolio-Automation/37-identity-access/results/
          if-no-files-found: ignore

  nightly-suite:
    name: Nightly Suite (Load, Backpressure, Pagination, Import & Migration)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Portfolio-Automation/37-identity-access
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install project dependencies
        run: |
          uv sync --frozen

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait

      - name: Seed SUT database with 10,000 baseline users
        run: |
          uv run python scripts/seed_users.py

      - name: Install Playwright browser dependencies (Edge)
        run: |
          uv run playwright install --with-deps msedge

      - name: Run Performance and Overload Shedding tests
        run: |
          uv run pytest tests/perf/test_load.py tests/resilience/test_overload.py -v

      - name: Run Admin User Pagination tests (10k walk, concurrent creation, prefix search)
        run: |
          uv run pytest tests/api/test_pagination.py -v

      - name: Run Partial Import Collision Policy tests (SKIP, OVERWRITE, FAIL)
        run: |
          uv run pytest tests/api/test_partial_import.py -v

      - name: Run Major Version Schema Upgrade tests (N-1 to N migration)
        run: |
          uv run pytest tests/migration/test_upgrade.py -v

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload full nightly test results and metrics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nightly-results
          path: |
            Portfolio-Automation/37-identity-access/results/
          if-no-files-found: ignore
