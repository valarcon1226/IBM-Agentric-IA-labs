name: 36-cdc-data-replication

on:
  push:
    paths:
      - 'Portfolio-Automation/36-cdc-data-replication/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/36-cdc-data-replication.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/36-cdc-data-replication/**'
      - 'Portfolio-Automation/qa_common/**'
      - '.github/workflows/36-cdc-data-replication.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      full_nightly:
        description: 'Run full nightly suite (resilience, migration, perf)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate (Lint, Types, Unit Tests & 10k Smoke Run)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Portfolio-Automation/36-cdc-data-replication
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install project dependencies
        run: |
          uv sync --frozen

      - name: Code quality and lint checks (Ruff)
        run: |
          uv run ruff check .

      - name: Static type validation (Mypy)
        run: |
          uv run mypy tests tools scripts

      - name: Run qa_common unit tests
        run: |
          uv run --directory ../qa_common pytest -v

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait

      # The reconciler tests write to both databases themselves, so they run
      # after the tables exist but before the connectors start replicating.
      - name: Run reconciler and workload unit tests
        run: |
          uv run python -c "from scripts.register import init_source_db, init_warehouse_db; init_source_db(); init_warehouse_db()"
          uv run pytest tests/unit -v

      - name: Register CDC connectors
        run: |
          uv run python scripts/register.py

      - name: Run 10k smoke replication against real stack
        run: |
          uv run python scripts/smoke_10k.py

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload results and traceability artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: pr-gate-results
          path: |
            Portfolio-Automation/36-cdc-data-replication/results/
            Portfolio-Automation/36-cdc-data-replication/docs/TRACEABILITY.md
          retention-days: 14

  nightly-suite:
    name: Nightly Suite (Perf, Resilience & Migration)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_nightly == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Portfolio-Automation/36-cdc-data-replication
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Start SUT Docker stack
        run: |
          docker compose up -d --wait

      - name: Register CDC connectors
        run: |
          uv run python scripts/register.py

      - name: Run Performance Lag test suite
        run: |
          uv run pytest tests/perf/test_lag.py -v -s

      - name: Run Resilience test suite (slow sink, crash, poison)
        if: ${{ !cancelled() }}
        run: |
          uv run pytest tests/resilience -v -s

      - name: Run Schema Migration & Upgrade test suite
        if: ${{ !cancelled() }}
        run: |
          uv run pytest tests/migration -v -s

      - name: Tear down SUT stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload nightly metrics and traces
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: nightly-metrics
          path: |
            Portfolio-Automation/36-cdc-data-replication/results/
            Portfolio-Automation/36-cdc-data-replication/docs/TRACEABILITY.md
          retention-days: 30
