name: 39-selenium-to-playwright-migration

on:
  push:
    paths:
      - 'Portfolio-Automation/39-selenium-to-playwright-migration/**'
      - '.github/workflows/39-selenium-to-playwright-migration.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/39-selenium-to-playwright-migration/**'
      - '.github/workflows/39-selenium-to-playwright-migration.yml'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of benchmark runs per suite'
        required: false
        type: number
        default: 5

permissions:
  contents: read

jobs:
  benchmark:
    name: Selenium 4 vs Playwright Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Portfolio-Automation/39-selenium-to-playwright-migration
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Create virtual environment and install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt

      - name: Verify unit tests for benchmark runner
        run: |
          .venv/bin/python -m pytest tests -q

      - name: Start OWASP Juice Shop SUT
        run: |
          docker compose up -d --wait

      - name: Run benchmark comparison
        env:
          RUNS_COUNT: ${{ github.event.inputs.runs || 5 }}
        run: |
          .venv/bin/python bench/run.py --runs "$RUNS_COUNT"

      - name: Publish benchmark markdown to GITHUB_STEP_SUMMARY
        if: always()
        run: |
          if [ -f results/benchmark.md ]; then
            cat results/benchmark.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop OWASP Juice Shop SUT
        if: always()
        run: |
          docker compose down -v

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: benchmark-results
          path: Portfolio-Automation/39-selenium-to-playwright-migration/results/
          retention-days: 14
