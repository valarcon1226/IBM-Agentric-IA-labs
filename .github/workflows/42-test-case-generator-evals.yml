name: 42-test-case-generator-evals

on:
  push:
    paths:
      - 'Portfolio-Automation/42-test-case-generator-evals/**'
      - '.github/workflows/42-test-case-generator-evals.yml'
  pull_request:
    paths:
      - 'Portfolio-Automation/42-test-case-generator-evals/**'
      - '.github/workflows/42-test-case-generator-evals.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-eval:
    name: Lint, Unit Tests & Stub Self-Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Portfolio-Automation/42-test-case-generator-evals
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.1.0
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Code quality checks (Ruff)
        run: |
          .venv/bin/python -m ruff check .

      - name: Run unit and integration tests (Pytest)
        run: |
          .venv/bin/python -m pytest -q

      - name: Run evaluator harness self-check with StubLLM
        run: |
          .venv/bin/python -m evals.runner --model stub --split dev

      - name: Upload evaluation report artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: stub-eval-reports
          path: Portfolio-Automation/42-test-case-generator-evals/reports/stub/
          retention-days: 14
