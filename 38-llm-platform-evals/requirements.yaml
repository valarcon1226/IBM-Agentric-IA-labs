version: "1.0"
project: "38-llm-platform-evals"
description: "Requirements traceability catalog for LLM platform gateway, cost control, resilience and RAG evaluation"

requirements:
  - id: "REQ-LLM-001"
    title: "Gateway Backpressure and Concurrency Throttling"
    description: "LiteLLM proxy enforces RPM and max_parallel_requests per virtual key, returning HTTP 429 with Retry-After when limits are breached."
    concern: "Backpressure"
    verification: "tests/resilience/test_limits.py"

  - id: "REQ-LLM-002"
    title: "Deterministic Retries and Upstream Fallbacks"
    description: "LiteLLM retries transient 5xx and 429 errors up to num_retries times with backoff, never retries client 4xx errors, and switches to fallback models when primary upstream remains exhausted."
    concern: "Retries"
    verification: "tests/resilience/test_retries.py"

  - id: "REQ-LLM-003"
    title: "Stream Disruption and Cut Integrity"
    description: "An interrupted SSE token stream must surface as an error or incomplete generation at all layers (client SDK, gateway, and UI), never masquerading as a successful complete answer."
    concern: "Partial failures"
    verification: "tests/resilience/test_stream_cut.py"

  - id: "REQ-LLM-004"
    title: "Token Cost Auditing and Strict Budget Caps"
    description: "Spend recorded in LiteLLM Postgres database must match prompt and completion tokens multiplied by configured pricing within ±1%. A key with max_budget cannot exceed budget by more than 1 request."
    concern: "Cost control"
    verification: "tests/api/test_cost.py"

  - id: "REQ-LLM-005"
    title: "Lossless Pagination for Keys and Spend Logs"
    description: "Administrative pagination endpoints for keys and spend logs must return all records exactly once with zero duplicates and zero skipped elements across varying page sizes."
    concern: "Pagination"
    verification: "tests/api/test_pagination.py"

  - id: "REQ-LLM-006"
    title: "Lossless Gateway Schema and State Migration"
    description: "Upgrading LiteLLM proxy from version N-1 to N must preserve all virtual keys, budget configurations, accumulated spend, and routing tables without manual remediation."
    concern: "Schema migrations"
    verification: "tests/migration/test_upgrade.py"

  - id: "REQ-LLM-007"
    title: "RAG Retrieval Quality Threshold"
    description: "The RAG pipeline must retrieve the gold source document in the top 5 results for at least 85% of answerable questions in the frozen test split (hit@5 >= 0.85)."
    concern: "RAG Evaluation"
    verification: "evals/run.py"

  - id: "REQ-LLM-008"
    title: "RAG Key Fact Correctness"
    description: "Generated RAG responses must contain all pre-registered required key facts (verified via regex) for at least 75% of answerable test queries."
    concern: "RAG Evaluation"
    verification: "evals/run.py"

  - id: "REQ-LLM-009"
    title: "Query Refusal Calibration"
    description: "The assistant must refuse at least 90% of unanswerable questions (refusal rate >= 0.90) while maintaining false refusal rate on answerable questions at or below 10% (<= 0.10)."
    concern: "RAG Evaluation"
    verification: "evals/run.py"

  - id: "REQ-LLM-010"
    title: "Citation Validity Invariant"
    description: "100% of citations produced in answers must correspond to real documents in the indexed corpus and match sources returned by retrieval."
    concern: "RAG Evaluation"
    verification: "evals/run.py"

  - id: "REQ-LLM-011"
    title: "Resilient Knowledge Ingestion"
    description: "Ingestion pipeline handles malformed or unparseable files gracefully: valid documents are fully indexed while failed documents are cataloged with descriptive error causes."
    concern: "Partial failures"
    verification: "scripts/corpus.py"

  - id: "REQ-LLM-012"
    title: "Proxy Latency Overhead Ceiling"
    description: "LiteLLM gateway routing overhead must not exceed 50 ms at p95 compared to direct upstream access on a 0 ms response."
    concern: "Performance"
    verification: "tests/resilience/test_limits.py"
