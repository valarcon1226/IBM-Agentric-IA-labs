services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: change_me_db_password
      POSTGRES_DB: deployments_db
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d deployments_db"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks:
      - cicd_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8022:8000"
    environment:
      DATABASE_URL: postgresql://appuser:change_me_db_password@db:5432/deployments_db
      APP_NAME: "12-ci-cd-pipeline-api"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cicd_net

networks:
  cicd_net:
    driver: bridge
