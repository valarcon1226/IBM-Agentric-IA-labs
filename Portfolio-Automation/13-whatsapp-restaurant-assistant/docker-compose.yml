services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LLM_FAKE: ${LLM_FAKE}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      GRAPH_API_VERSION: ${GRAPH_API_VERSION}
      GRAPH_API_BASE: ${GRAPH_API_BASE}
      STAFF_WA_IDS: ${STAFF_WA_IDS}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      REMINDER_TEMPLATE: ${REMINDER_TEMPLATE}
      DEV_MODE: ${DEV_MODE}
      DEV_API_KEY: ${DEV_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # Free public HTTPS URL for the WhatsApp webhook without a Cloudflare account (DECISIONES-13
  # W2/W11). Opt-in only: `docker compose --profile tunnel up cloudflared`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
