[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-intake-pipeline"
version = "0.1.0"
description = "Document intake pipeline test suite for Paperless-ngx"
requires-python = ">=3.12"
dependencies = [
    "qa-common",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-playwright>=0.5.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "locust>=2.28.0",
    "psycopg[binary]>=3.1.18",
    "fpdf2>=2.8.2",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-repeat>=0.9.4",
]

[tool.uv]
package = false

[tool.uv.sources]
qa-common = { path = "../qa_common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "p1: PR gate tests",
    "resilience: Fault injection and backpressure tests",
    "migration: Schema migration and upgrade tests",
    "perf: Performance and latency benchmark tests",
    "eval: Machine learning classifier evaluation tests",
    "ui: End-to-end UI and accessibility tests",
    "req(id): Requirements traceability marker",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "."
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
