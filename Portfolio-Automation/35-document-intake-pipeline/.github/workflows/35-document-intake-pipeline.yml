name: 35-document-intake-pipeline

on:
  push:
    branches:
      - main
    paths:
      - "35-document-intake-pipeline/**"
      - ".github/workflows/35-document-intake-pipeline.yml"
      - "qa_common/**"
  pull_request:
    branches:
      - main
    paths:
      - "35-document-intake-pipeline/**"
      - ".github/workflows/35-document-intake-pipeline.yml"
      - "qa_common/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Document Intake Pipeline Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: 35-document-intake-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a # v5.2.1
        with:
          enable-cache: true
          version: "0.5.21"

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install project and root dependencies
        run: |
          uv sync --frozen || uv sync

      - name: Install Playwright browser
        run: |
          uv run playwright install firefox

      - name: Start Paperless Docker Stack
        run: |
          docker compose up -d --wait

      - name: Configure and Bootstrap Paperless
        run: |
          uv run python scripts/setup.py

      - name: Run Ruff Lint Checks
        run: |
          uv run ruff check .

      - name: Run Mypy Type Checks
        run: |
          uv run mypy .

      - name: Run Corpus Determinism Tests
        run: |
          uv run pytest tests/test_corpus.py -v

      - name: Run Partial Failure Tests
        run: |
          uv run pytest tests/api/test_partial.py -v

      - name: Run Pagination and Search Performance Tests
        run: |
          uv run pytest tests/api/test_pagination.py -v

      - name: Run Resilience Burst Test
        run: |
          uv run pytest tests/resilience/test_burst.py -v

      - name: Run Fault Injection Tests
        run: |
          uv run pytest tests/resilience/test_faults.py -v

      - name: Run Classifier Evaluation
        run: |
          uv run pytest tests/eval/test_classifier.py -v -m eval

      - name: Run UI Flow Tests
        run: |
          uv run pytest tests/ui/test_document_flow.py -v

      - name: Tear Down Docker Stack
        if: always()
        run: |
          docker compose down -v

      - name: Upload Test Results and Metrics
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: test-results-and-metrics
          path: |
            35-document-intake-pipeline/results/
            35-document-intake-pipeline/corpus/manifest.sha256
          if-no-files-found: ignore
