[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-order-integrity"
version = "0.1.0"
description = "E-commerce order integrity test suite for Saleor"
requires-python = ">=3.12"
dependencies = [
    "qa-common",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-playwright>=0.5.0",
    "hypothesis>=6.100.0",
    "locust>=2.28.0",
    "psycopg[binary]>=3.1.18",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest-repeat>=0.9.4",
]

[tool.uv]
package = false

[tool.uv.sources]
qa-common = { path = "../qa_common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
