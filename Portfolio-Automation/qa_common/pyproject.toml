[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-common"
version = "0.1.0"
description = "Shared QA automation utilities and fixtures"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.entry-points.pytest11]
qa_common = "qa_common.plugin"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
