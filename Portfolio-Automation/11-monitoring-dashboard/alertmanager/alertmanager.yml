global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'job']
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 1h
  receiver: 'webhook-sink'
  routes:
    - match:
        severity: critical
      receiver: 'webhook-sink'
    - match:
        severity: warning
      receiver: 'webhook-sink'

receivers:
  - name: 'webhook-sink'
    webhook_configs:
      - url: 'http://webhook-sink:5001/webhook'
        send_resolved: true

  # Slack receiver para entornos productivos (documentado, requiere webhook real)
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/<workspace_id>/<channel_id>/<token_placeholder>'
        channel: '#alerts'
        send_resolved: true
