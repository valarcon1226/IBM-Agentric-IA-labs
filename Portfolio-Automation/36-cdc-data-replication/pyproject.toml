[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdc-data-replication"
version = "0.1.0"
description = "CDC data replication test suite with Debezium, Postgres, and Redpanda"
requires-python = ">=3.12"
dependencies = [
    "qa-common",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "hypothesis>=6.100.0",
    "psycopg[binary]>=3.1.18",
    "confluent-kafka>=2.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.uv.sources]
qa-common = { path = "../qa_common", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "tools"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
