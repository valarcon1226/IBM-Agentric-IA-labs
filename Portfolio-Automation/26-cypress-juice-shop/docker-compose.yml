services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    container_name: juice-shop-sut
    ports:
      - '127.0.0.1:8641:3000'
    environment:
      - NODE_ENV=unsafe
    healthcheck:
      test:
        - 'CMD'
        - '/nodejs/bin/node'
        - '-e'
        - "fetch('http://127.0.0.1:3000/rest/admin/application-version').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
