services:
  postgres:
    image: postgres:16.8-alpine3.21
    container_name: llm-postgres
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: litellm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.59.8
    container_name: llm-litellm
    mem_limit: 2048m
    network_mode: "host"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/litellm"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 5s
      timeout: 5s
      retries: 15

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.5.18
    container_name: llm-openwebui
    mem_limit: 2048m
    network_mode: "host"
    depends_on:
      litellm:
        condition: service_healthy
    environment:
      PORT: "8088"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      OPENAI_API_BASE_URL: "http://127.0.0.1:4000/v1"
      OPENAI_API_KEY: "${LITELLM_MASTER_KEY}"
      WEBUI_AUTH: "False"
      DATA_DIR: "/app/backend/data"
    volumes:
      - openwebui_data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8088/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
  openwebui_data:
