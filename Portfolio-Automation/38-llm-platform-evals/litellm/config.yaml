model_list:
  - model_name: primary-model
    litellm_params:
      model: ollama/qwen3:4b-instruct-2507-q4_K_M
      api_base: http://127.0.0.1:11434
      timeout: 30
    model_info:
      id: primary-model
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000020

  - model_name: fallback-model
    litellm_params:
      model: ollama/qwen3:4b
      api_base: http://127.0.0.1:11434
      timeout: 30
    model_info:
      id: fallback-model
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000020

  - model_name: fake-primary
    litellm_params:
      model: openai/fake-gpt-primary-1
      api_base: http://127.0.0.1:8001/v1
      api_key: fake-upstream-test-key
      timeout: 10
    model_info:
      id: fake-primary-1
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000020

  - model_name: fake-primary
    litellm_params:
      model: openai/fake-gpt-primary-2
      api_base: http://127.0.0.1:8001/v1
      api_key: fake-upstream-test-key
      timeout: 10
    model_info:
      id: fake-primary-2
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000020

  - model_name: fake-primary
    litellm_params:
      model: openai/fake-gpt-primary-3
      api_base: http://127.0.0.1:8001/v1
      api_key: fake-upstream-test-key
      timeout: 10
    model_info:
      id: fake-primary-3
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000020

  - model_name: fake-fallback
    litellm_params:
      model: openai/fake-gpt-fallback
      api_base: http://127.0.0.1:8001/v1
      api_key: fake-upstream-test-key
      timeout: 10
    model_info:
      id: fake-fallback
      input_cost_per_token: 0.0000015
      output_cost_per_token: 0.0000020

  - model_name: fake-cost
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_base: http://127.0.0.1:8001/v1
      api_key: fake-upstream-test-key
      timeout: 10
    model_info:
      id: fake-cost
      input_cost_per_token: 0.0005
      output_cost_per_token: 0.0015

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  retry_after: 2
  timeout: 30
  allowed_fails: 5
  cooldown_time: 0
  retry_policy:
    InternalServerErrorRetries: 2
    RateLimitErrorRetries: 2
    TimeoutErrorRetries: 2
    BadRequestErrorRetries: 0
  fallbacks:
    - primary-model: ["fallback-model"]
    - fake-primary: ["fake-fallback"]

litellm_settings:
  num_retries: 2
  request_timeout: 30
  telemetry: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  proxy_batch_write_at: 6
