version: '3.8'

services:
  selenium:
    image: selenium/standalone-edge:4.19.1
    container_name: selenium
    ports:
      - "4444:4444"
    shm_size: 2gb

  tests:
    image: maven:3.9-eclipse-temurin-21
    container_name: java-tests
    volumes:
      - .:/app
      - maven-repo:/root/.m2
    working_dir: /app
    depends_on:
      - selenium
    environment:
      - SELENIUM_URL=http://selenium:4444/wd/hub

volumes:
  maven-repo:
