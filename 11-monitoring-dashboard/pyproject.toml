[project]
name = "monitoring-dashboard"
version = "1.0.0"
requires-python = ">=3.12"
description = "Observability stack with Prometheus, Alertmanager, Grafana, Loki, Promtail, Node & Postgres Exporters"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m \"not integration\""
markers = [
    "integration: needs running Docker compose monitoring stack",
]

[tool.coverage.run]
source = ["demo_app", "webhook_sink"]
