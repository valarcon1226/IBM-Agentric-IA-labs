services:
  postgres-source:
    image: postgres:16-alpine
    container_name: cdc-postgres-source
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: source_db
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d source_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 512m

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: cdc-redpanda
    command: >
      redpanda start
      --smp 1
      --memory 512M
      --reserve-memory 0M
      --overprovisioned
      --node-id 0
      --check=false
      --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:9092
    ports:
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: *true'"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    mem_limit: 768m

  postgres-warehouse:
    image: postgres:16-alpine
    container_name: cdc-postgres-warehouse
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: warehouse_db
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    mem_limit: 512m

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: cdc-toxiproxy
    command:
      - "-host=0.0.0.0"
      - "-config=/etc/toxiproxy.json"
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "127.0.0.1:8474:8474"
    expose:
      - "5432"
    depends_on:
      postgres-warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    mem_limit: 128m

  connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-2.7.3.Final}
    container_name: cdc-connect
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: cdc_connect_group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://127.0.0.1:8083/connectors || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: 1024m
