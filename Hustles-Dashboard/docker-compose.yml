# Dashboard del jobHunter: lee EN VIVO la jobs.db y los CVs que escriben scout/tailor en ../jobhunter
# (carpeta hermana en el homelab), así que no hace falta sincronizar nada.
# Los datos están en Profiles/<nombre>/; para ver otro perfil cambia PROFILE_DIR.
services:
  hustles-dashboard:
    build: .
    container_name: hustles-dashboard
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8100:8100"
    volumes:
      - ../jobhunter:/jobhunter
    environment:
      - JOBS_DB_PATH=/jobhunter/Profiles/Valentina Alarcon/jobs.db
      - CVS_DIR=/jobhunter/Profiles/Valentina Alarcon/CVs_Listos
      - JOBHUNTER_CODE_DIR=/jobhunter
